{% extends "base.html" %}
{% block title %}{{ resource.title }} - Reading{% endblock %}
{% block content %}
  <style>
    .reader-wrap { position: relative; width: 100%; height: calc(100vh - 120px); }
    .reader-iframe { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 0.375rem; }
    .watermark-footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #0b5fa5; color: #fff; font-size: 0.8rem;
      text-align: center; padding: 0.35rem;
      z-index: 10;
    }
  </style>
  <h1>{{ resource.title }}</h1>
  <p class="subtitle">Licensed material - for your personal study only.</p>
  <div class="reader-wrap">
    <iframe
      class="reader-iframe"
      src="{% url 'library-stream' resource.public_id %}"
      sandbox="allow-same-origin allow-scripts"
      title="Document viewer"></iframe>
  </div>
  <div class="watermark-footer" aria-hidden="true">
    Watermarked for {{ user.get_full_name|default:user.username }} &middot; {% now "Y-m-d H:i" %}
  </div>
{% endblock %}
