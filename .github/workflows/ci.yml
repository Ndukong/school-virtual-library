name: gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django static checks
        run: |
          python manage.py check --settings=config.settings_test
          python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Locale catalog fresh
        run: |
          python tools/compile_messages.py
          git diff --exit-code -- locale

      - name: Full test suite (settings_test)
        run: python manage.py test --settings=config.settings_test

      - name: Deploy-mode checks (DEBUG=False boot guard + security defaults)
        run: |
          env DEBUG=False SECRET_KEY=ci-deploy-gate-not-for-production ALLOWED_HOSTS=library.example.org \
            python manage.py check --deploy

      - name: Dependency vulnerability audit
        run: pip-audit --progress-spinner=off

  gate-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        shell: bash
        run: ruff check .

      - name: Full test suite (settings_test)
        shell: bash
        run: python manage.py test --settings=config.settings_test

      - name: Deploy-mode checks
        shell: bash
        run: |
          env DEBUG=False SECRET_KEY=ci-deploy-gate-not-for-production ALLOWED_HOSTS=library.example.org \
            python manage.py check --deploy

      - name: Dependency vulnerability audit
        shell: bash
        run: pip-audit --progress-spinner=off